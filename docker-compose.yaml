services:
  nuxt-app:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: migi987/app-niebieskie-aparaty-v2:1.0
    platform: linux/amd64
    ports:
      - "4600:4600"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NITRO_PORT: "4600"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:4600/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
